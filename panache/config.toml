# Markdown flavor and line width
flavor = "gfm"

# Formatting style
[format]
wrap = "semantic"
line-width = 80
line-ending = "auto"


# External code formatters (opt-in)
[formatters]
bash = ["shuck"]
sh = ["shuck"]
zsh = ["shuck-zsh"]
python = ["ruff"]
latex = "badness"
javascript = ["oxfmt"]
typescript = ["oxfmt"]

[formatters.shuck]
cmd = "shuck"
args = ["format", "--stdin-filename", "stdin.sh", "-"]
stdin = true

[formatters.shuck-zsh]
cmd = "shuck"
args = ["format", "--stdin-filename", "stdin.zsh", "-"]
stdin = true

[formatters.oxfmt]
cmd = "oxfmt"
args = ["--stdin-filepath=stdin.js"]
stdin = true


# External code linters
[linters]
python = "ruff"
