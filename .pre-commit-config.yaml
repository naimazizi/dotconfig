# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
# This configuration is aligned with the Neovim formatter setup at nvim/lua/plugins/formatter.lua
repos:
  # General file fixes and checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.git|\.pyc|\.egg-info|^opencode/'
      - id: end-of-file-fixer
        exclude: '\.git|\.pyc|\.egg-info|niri/dms/|^opencode/'
      - id: check-json
        exclude: "^zed/|^opencode/"
      - id: check-yaml
        args: ["--unsafe"]
        exclude: "^opencode/"

  # Python formatting with ruff (ruff_format)
  - repo: local
    hooks:
      - id: ruff-format
        name: Ruff format
        entry: ruff format
        language: system
        types: [python]
        pass_filenames: true

  # Lua formatting with stylua
  - repo: local
    hooks:
      - id: stylua
        name: Stylua format
        entry: stylua
        language: system
        types: [lua]
        pass_filenames: true

  # Shell script formatting and linting with shuck
  - repo: local
    hooks:
      - id: shuck-format
        name: Shuck format
        entry: shuck format
        language: system
        types: [shell]
        pass_filenames: true
      - id: shuck-check
        name: Shuck lint
        entry: shuck check
        language: system
        types: [shell]
        pass_filenames: true

  # Markdown linter & formatting with panache
  - repo: local
    hooks:
      - id: panache-format
        name: Panache format
        entry: panache --config panache/config.toml format --force-exclude
        language: system
        files: '\.(qmd|Rmd|md|markdown|mdown|mkd)$'
        require_serial: true
        exclude: "^opencode/"
      - id: panache-lint
        name: Panache lint
        entry: panache --config panache/config.toml lint --force-exclude
        language: system
        files: '\.(qmd|Rmd|md|markdown|mdown|mkd)$'
        require_serial: true
        exclude: "^opencode/"

  # Typst formatting with typstyle
  - repo: local
    hooks:
      - id: typstyle
        name: typstyle format
        entry: typstyle --fmt
        language: system
        files: '\.typ$'
        pass_filenames: true

  # KDL formatting with kdlfmt
  - repo: https://github.com/hougesen/kdlfmt
    rev: main
    hooks:
      - id: kdlfmt-format

  # web-specific file type formatting with oxfmt
  - repo: local
    hooks:
      - id: oxfmt
        name: oxfmt format
        entry: oxfmt
        language: system
        types_or: [javascript, json, yaml, toml]
        pass_filenames: true

  # Typos checking
  - repo: https://github.com/crate-ci/typos
    rev: v1.45.1
    hooks:
      - id: typos
