# Applies to every `kitten ssh` connection; narrow hostname for trusted hosts only.
hostname *
login_shell zsh

# Keep remote dotfiles untouched. These managed copies refresh on each connection.
env ZDOTDIR=$HOME/.local/share/kitty-dotfiles/zsh
env VIMINIT=source $HOME/.local/share/kitty-dotfiles/vim/vimrc
env EDITOR=vim
env VISUAL=vim
env STARSHIP_CONFIG=$HOME/.local/share/kitty-dotfiles/starship.toml

# Explicit files only: never copy credentials, history, plugin caches, or native binaries.
copy --symlink-strategy=resolve --dest=.local/share/kitty-dotfiles/zsh/.zshrc .config/zsh/.zshrc
copy --symlink-strategy=resolve --dest=.local/share/kitty-dotfiles/zsh/.zfunc/fzg .config/zsh/.zfunc/fzg
copy --symlink-strategy=resolve --dest=.local/share/kitty-dotfiles/vim/vimrc .config/vim/vimrc
copy --symlink-strategy=resolve --dest=.local/share/kitty-dotfiles/vim/coc-settings.json .config/vim/coc-settings.json
copy --symlink-strategy=resolve --dest=.local/share/kitty-dotfiles/panache/config.toml .config/panache/config.toml
copy --symlink-strategy=resolve --dest=.local/share/kitty-dotfiles/starship.toml .config/starship.toml
